name: Deploy ConstructRegis link
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create link to REG.RU site
        run: |
          mkdir -p public
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=https://constructregis.ru/"><title>ConstructRegis</title><link rel="canonical" href="https://constructregis.ru/"><body><h1>ConstructRegis</h1><p>Общий реестр переехал на новый адрес.</p><a href="https://constructregis.ru/">Открыть constructregis.ru</a><script>location.replace('https://constructregis.ru/');</script></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
